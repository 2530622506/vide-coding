<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GESP Practice Prototype</title>
    <style>
      :root {
        --primary: #2563eb;
        --primary-strong: #1d4ed8;
        --cyan: #0891b2;
        --green: #059669;
        --gold: #d97706;
        --pink: #db2777;
        --red: #dc2626;
        --ink: #0f172a;
        --text: #334155;
        --subtle: #64748b;
        --muted: #f6f8fc;
        --surface: #ffffff;
        --line: #dbe4f0;
        --line-strong: #cbd5e1;
        --shadow: 0 18px 50px rgba(15, 23, 42, 0.09);
        --radius: 8px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #eef4ff;
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      .screen {
        width: 1440px;
        min-height: 1100px;
        margin: 0 auto;
        background:
          linear-gradient(180deg, rgba(239, 246, 255, 0.92), rgba(248, 250, 252, 1) 280px),
          #f8fafc;
        overflow: hidden;
      }

      .mobile-screen {
        width: 390px;
        min-height: 844px;
        margin: 0;
        background: #f8fafc;
        overflow: hidden;
      }

      .app-shell {
        display: grid;
        grid-template-columns: 236px 1fr;
        min-height: 1100px;
      }

      .sider {
        background: #0f172a;
        color: #e2e8f0;
        padding: 24px 16px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        height: 44px;
        margin-bottom: 26px;
        padding: 0 8px;
      }

      .brand-mark {
        display: grid;
        width: 34px;
        height: 34px;
        place-items: center;
        border-radius: 8px;
        background: #2563eb;
        color: #fff;
        font-weight: 800;
      }

      .brand-title {
        display: grid;
        gap: 2px;
      }

      .brand-title strong {
        color: #fff;
        font-size: 15px;
      }

      .brand-title span {
        color: #94a3b8;
        font-size: 12px;
      }

      .nav-section {
        margin-top: 18px;
      }

      .nav-label {
        padding: 0 10px 8px;
        color: #718096;
        font-size: 12px;
        font-weight: 700;
      }

      .nav-item {
        display: flex;
        align-items: center;
        gap: 10px;
        height: 40px;
        margin-bottom: 4px;
        padding: 0 10px;
        border-radius: 8px;
        color: #cbd5e1;
        font-size: 14px;
      }

      .nav-item.active {
        background: #1d4ed8;
        color: #fff;
      }

      .nav-item svg {
        width: 17px;
        height: 17px;
        stroke-width: 2;
      }

      .main {
        padding: 22px 28px 32px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 18px;
      }

      .page-title {
        display: grid;
        gap: 4px;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--primary);
        font-size: 13px;
        font-weight: 700;
      }

      .page-title h1,
      .mobile-title h1 {
        margin: 0;
        color: var(--ink);
        font-size: 28px;
        line-height: 1.18;
      }

      .page-title p {
        margin: 0;
        color: var(--subtle);
        font-size: 14px;
      }

      .actions,
      .row-actions,
      .inline-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        min-height: 34px;
        padding: 0 14px;
        border: 1px solid var(--line-strong);
        border-radius: 8px;
        background: #fff;
        color: var(--text);
        font-size: 14px;
        font-weight: 600;
      }

      .btn.primary {
        border-color: var(--primary);
        background: var(--primary);
        color: #fff;
      }

      .btn.text {
        border-color: transparent;
        background: transparent;
        color: var(--primary);
      }

      .btn.ghost-primary {
        border-color: #bfdbfe;
        background: #eff6ff;
        color: var(--primary-strong);
      }

      .btn.danger {
        border-color: #fecaca;
        background: #fff1f2;
        color: #be123c;
      }

      .icon-btn {
        width: 34px;
        height: 34px;
        padding: 0;
      }

      .card,
      .panel,
      .ant-card {
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--surface);
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
      }

      .panel {
        padding: 16px;
      }

      .panel-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
      }

      .panel-title h2,
      .panel-title h3,
      .section-title h2,
      .section-title h3 {
        margin: 0;
        color: var(--ink);
        font-size: 17px;
        line-height: 1.25;
      }

      .panel-title p,
      .section-title p {
        margin: 4px 0 0;
        color: var(--subtle);
        font-size: 13px;
      }

      .metric-grid {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 12px;
        margin-bottom: 16px;
      }

      .metric {
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: #fff;
      }

      .metric span {
        color: var(--subtle);
        font-size: 12px;
      }

      .metric strong {
        display: block;
        margin-top: 6px;
        color: var(--ink);
        font-size: 24px;
        line-height: 1;
      }

      .metric em {
        display: block;
        margin-top: 8px;
        color: var(--green);
        font-size: 12px;
        font-style: normal;
        font-weight: 700;
      }

      .tag {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        min-height: 22px;
        padding: 0 8px;
        border: 1px solid #bfdbfe;
        border-radius: 6px;
        background: #eff6ff;
        color: #1d4ed8;
        font-size: 12px;
        font-weight: 600;
        white-space: nowrap;
      }

      .tag.green {
        border-color: #bbf7d0;
        background: #f0fdf4;
        color: #047857;
      }

      .tag.gold {
        border-color: #fde68a;
        background: #fffbeb;
        color: #b45309;
      }

      .tag.pink {
        border-color: #fbcfe8;
        background: #fdf2f8;
        color: #be185d;
      }

      .tag.gray {
        border-color: #e2e8f0;
        background: #f8fafc;
        color: #475569;
      }

      .tag.cyan {
        border-color: #a5f3fc;
        background: #ecfeff;
        color: #0e7490;
      }

      .segmented {
        display: inline-flex;
        padding: 3px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #f8fafc;
      }

      .segmented span {
        min-width: 66px;
        padding: 6px 11px;
        border-radius: 6px;
        color: var(--subtle);
        font-size: 13px;
        font-weight: 700;
        text-align: center;
      }

      .segmented span.active {
        background: #fff;
        color: var(--primary);
        box-shadow: 0 1px 3px rgba(15, 23, 42, 0.12);
      }

      .search-row {
        display: grid;
        grid-template-columns: 1fr 160px 150px 140px;
        gap: 10px;
        margin-bottom: 14px;
      }

      .input,
      .select,
      .textarea {
        width: 100%;
        min-height: 36px;
        border: 1px solid var(--line-strong);
        border-radius: 8px;
        background: #fff;
        color: var(--text);
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .input {
        padding: 0 12px;
      }

      .select {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 10px;
        color: var(--text);
        font-size: 13px;
        white-space: nowrap;
      }

      .input span,
      .select span {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .workspace-grid {
        display: grid;
        grid-template-columns: 242px minmax(0, 1fr) 340px;
        gap: 14px;
        align-items: start;
      }

      .domain-list {
        display: grid;
        gap: 8px;
      }

      .domain-item {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
      }

      .domain-item.active {
        border-color: #93c5fd;
        background: #eff6ff;
      }

      .domain-item strong {
        color: var(--ink);
        font-size: 14px;
      }

      .domain-item small {
        color: var(--subtle);
        font-size: 12px;
      }

      .type-card {
        margin-bottom: 12px;
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
      }

      .type-header {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
      }

      .type-header h3 {
        margin: 0;
        color: var(--ink);
        font-size: 16px;
      }

      .knowledge-row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 12px;
      }

      .problem-row {
        display: grid;
        grid-template-columns: 54px 1fr 94px;
        gap: 12px;
        padding: 11px 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fbfdff;
      }

      .problem-row + .problem-row {
        margin-top: 8px;
      }

      .problem-row.active {
        border-color: #93c5fd;
        background: #eff6ff;
      }

      .problem-index {
        display: grid;
        place-items: center;
        border-radius: 8px;
        background: #e0f2fe;
        color: #0369a1;
        font-size: 12px;
        font-weight: 800;
      }

      .problem-main strong {
        display: block;
        margin-bottom: 7px;
        color: var(--ink);
        font-size: 14px;
      }

      .problem-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
      }

      .mini-chart {
        display: grid;
        gap: 8px;
      }

      .bar-row {
        display: grid;
        grid-template-columns: 78px 1fr 38px;
        align-items: center;
        gap: 8px;
        color: var(--subtle);
        font-size: 12px;
      }

      .bar {
        height: 8px;
        border-radius: 999px;
        background: #e2e8f0;
        overflow: hidden;
      }

      .bar span {
        display: block;
        height: 100%;
        border-radius: inherit;
        background: var(--primary);
      }

      .bar.green span {
        background: var(--green);
      }

      .bar.gold span {
        background: var(--gold);
      }

      .detail-stack {
        display: grid;
        gap: 12px;
      }

      .answer-card {
        padding: 14px;
        border-radius: 8px;
        background: #f8fafc;
        border: 1px solid var(--line);
      }

      .answer-card h3 {
        margin: 0 0 8px;
        color: var(--ink);
        font-size: 16px;
      }

      .answer-card p {
        margin: 0;
        color: var(--text);
        font-size: 13px;
        line-height: 1.65;
      }

      .step-list {
        margin: 0;
        padding-left: 18px;
        color: var(--text);
        font-size: 13px;
        line-height: 1.7;
      }

      .queue-card {
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
      }

      .queue-card + .queue-card {
        margin-top: 8px;
      }

      .queue-card strong {
        display: block;
        margin-bottom: 6px;
        color: var(--ink);
        font-size: 14px;
      }

      .queue-card p {
        margin: 0 0 8px;
        color: var(--subtle);
        font-size: 12px;
        line-height: 1.5;
      }

      .practice-grid {
        display: grid;
        grid-template-columns: 380px minmax(0, 1fr) 320px;
        gap: 14px;
      }

      .statement-box {
        display: grid;
        gap: 12px;
      }

      .problem-hero {
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
      }

      .problem-hero h2 {
        margin: 6px 0 8px;
        color: var(--ink);
        font-size: 22px;
      }

      .problem-hero p {
        margin: 0;
        color: var(--subtle);
        font-size: 13px;
        line-height: 1.65;
      }

      .code-window {
        overflow: hidden;
        border: 1px solid #1e293b;
        border-radius: 8px;
        background: #0b1220;
      }

      .code-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 42px;
        padding: 0 12px;
        border-bottom: 1px solid #1e293b;
        color: #cbd5e1;
        font-size: 13px;
      }

      pre {
        margin: 0;
        white-space: pre-wrap;
        font-family: "Fira Code", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      .code-window pre {
        min-height: 520px;
        padding: 18px;
        color: #dbeafe;
        font-size: 13px;
        line-height: 1.62;
      }

      .sample-box {
        display: grid;
        gap: 10px;
      }

      .sample-card {
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
      }

      .sample-card strong {
        display: block;
        color: var(--ink);
        font-size: 13px;
        margin-bottom: 7px;
      }

      .sample-card pre {
        padding: 10px;
        border-radius: 6px;
        background: #f1f5f9;
        color: #334155;
        font-size: 12px;
      }

      .builder-grid {
        display: grid;
        grid-template-columns: 330px minmax(0, 1fr) 360px;
        gap: 14px;
      }

      .checkbox-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 10px 0;
        border-bottom: 1px solid var(--line);
      }

      .checkbox-row:last-child {
        border-bottom: 0;
      }

      .check {
        width: 16px;
        height: 16px;
        border: 1px solid var(--line-strong);
        border-radius: 4px;
      }

      .check.on {
        border-color: var(--primary);
        background: var(--primary);
        box-shadow: inset 0 0 0 3px #fff;
      }

      .paper-preview {
        padding: 18px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
      }

      .paper-preview h3 {
        margin: 0 0 12px;
        color: var(--ink);
        font-size: 18px;
      }

      .paper-item {
        padding: 12px 0;
        border-top: 1px solid var(--line);
      }

      .paper-item strong {
        display: block;
        margin-bottom: 6px;
        color: var(--ink);
        font-size: 14px;
      }

      .paper-item p {
        margin: 0;
        color: var(--subtle);
        font-size: 12px;
        line-height: 1.55;
      }

      .coverage-grid {
        display: grid;
        grid-template-columns: 320px minmax(0, 1fr);
        gap: 14px;
      }

      .heatmap {
        display: grid;
        grid-template-columns: repeat(10, 1fr);
        gap: 8px;
      }

      .heat-cell {
        height: 42px;
        border-radius: 8px;
        border: 1px solid #bfdbfe;
        background: #eff6ff;
      }

      .heat-cell.level-2 {
        background: #dbeafe;
      }

      .heat-cell.level-3 {
        background: #93c5fd;
      }

      .heat-cell.level-4 {
        background: #2563eb;
      }

      .evidence-table {
        width: 100%;
        border-collapse: collapse;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
      }

      .evidence-table th,
      .evidence-table td {
        padding: 12px;
        border-bottom: 1px solid var(--line);
        text-align: left;
        font-size: 13px;
      }

      .evidence-table th {
        background: #f8fafc;
        color: var(--subtle);
        font-weight: 700;
      }

      .evidence-table td {
        color: var(--text);
      }

      .evidence-table tr:last-child td {
        border-bottom: 0;
      }

      .source-grid {
        display: grid;
        grid-template-columns: 310px minmax(0, 1fr) 330px;
        gap: 14px;
        align-items: start;
      }

      .source-card {
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
      }

      .source-card + .source-card {
        margin-top: 8px;
      }

      .source-card.active {
        border-color: #93c5fd;
        background: #eff6ff;
      }

      .source-card strong {
        display: block;
        margin-bottom: 5px;
        color: var(--ink);
        font-size: 14px;
      }

      .source-card p {
        margin: 0 0 8px;
        color: var(--subtle);
        font-size: 12px;
        line-height: 1.5;
      }

      .source-map {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }

      .map-node {
        min-height: 112px;
        padding: 13px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
      }

      .map-node strong {
        display: block;
        margin: 8px 0 6px;
        color: var(--ink);
        font-size: 14px;
      }

      .map-node p {
        margin: 0;
        color: var(--subtle);
        font-size: 12px;
        line-height: 1.5;
      }

      .timeline {
        display: grid;
        gap: 10px;
      }

      .timeline-step {
        display: grid;
        grid-template-columns: 26px 1fr auto;
        gap: 10px;
        align-items: start;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
      }

      .step-dot {
        display: grid;
        width: 26px;
        height: 26px;
        place-items: center;
        border-radius: 50%;
        background: #dbeafe;
        color: var(--primary);
        font-size: 12px;
        font-weight: 800;
      }

      .timeline-step strong {
        display: block;
        margin-bottom: 4px;
        color: var(--ink);
        font-size: 14px;
      }

      .timeline-step p {
        margin: 0;
        color: var(--subtle);
        font-size: 12px;
        line-height: 1.5;
      }

      .maintenance-grid {
        display: grid;
        grid-template-columns: 310px minmax(0, 1fr) 340px;
        gap: 14px;
        align-items: start;
      }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .field {
        display: grid;
        gap: 6px;
      }

      .field.full {
        grid-column: 1 / -1;
      }

      .field label {
        color: var(--ink);
        font-size: 13px;
        font-weight: 700;
      }

      .textarea {
        min-height: 92px;
        padding: 10px 12px;
        color: var(--text);
        font-size: 13px;
        line-height: 1.55;
      }

      .mock-editor {
        min-height: 180px;
        padding: 12px;
        border: 1px solid var(--line-strong);
        border-radius: 8px;
        background: #fff;
        color: var(--text);
        font-size: 13px;
        line-height: 1.65;
      }

      .mock-editor.compact {
        min-height: 54px;
      }

      .mock-editor.medium {
        min-height: 82px;
      }

      .asset-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }

      .asset-tile {
        min-height: 92px;
        padding: 12px;
        border: 1px dashed #93c5fd;
        border-radius: 8px;
        background: #eff6ff;
      }

      .asset-tile strong {
        display: block;
        color: var(--ink);
        font-size: 13px;
        margin-bottom: 6px;
      }

      .asset-tile p {
        margin: 0;
        color: var(--subtle);
        font-size: 12px;
        line-height: 1.5;
      }

      .preview-list {
        display: grid;
        gap: 8px;
      }

      .atcoder-grid {
        display: grid;
        grid-template-columns: 250px minmax(0, 1fr) 360px;
        gap: 14px;
        align-items: start;
      }

      .difficulty-tabs {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 14px;
        padding: 4px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #f8fafc;
      }

      .difficulty-tabs span {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 34px;
        padding: 0 14px;
        border-radius: 6px;
        color: var(--subtle);
        font-size: 13px;
        font-weight: 700;
      }

      .difficulty-tabs span.active {
        background: #fff;
        color: var(--primary);
        box-shadow: 0 1px 3px rgba(15, 23, 42, 0.12);
      }

      .atcoder-row {
        display: grid;
        grid-template-columns: 82px 1fr 112px;
        gap: 12px;
        align-items: center;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
      }

      .atcoder-row + .atcoder-row {
        margin-top: 8px;
      }

      .atcoder-row.active {
        border-color: #93c5fd;
        background: #eff6ff;
