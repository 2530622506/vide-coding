<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#eff9f7" />
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="面向 GESP 与 AtCoder 的算法练习工作台，支持题库浏览、题目维护、来源证据和 IDE 练习。"
    />
    <meta name="application-name" content="算法练习工作台" />
    <link
      rel="icon"
      href='data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"%3E%3Crect width="48" height="48" rx="10" fill="%23d9f3ee"/%3E%3Cpath d="M24 10 36 16 24 22 12 16 24 10Z" fill="none" stroke="%23167f7b" stroke-width="3" stroke-linejoin="round"/%3E%3Cpath d="M12 24 24 30 36 24M12 32 24 38 36 32" fill="none" stroke="%23167f7b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/%3E%3C/svg%3E'
    />
    <title>算法练习工作台</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      :root {
        color: #18221f;
        background: #eef1eb;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        font-kerning: normal;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
      }

      html {
        min-width: 320px;
      }

      body {
        background: #eef1f3;
        margin: 0;
        min-width: 320px;
      }

      .boot-shell {
        align-items: stretch;
        display: grid;
        gap: 24px;
        grid-template-columns: 252px minmax(0, 1fr);
        min-height: 100vh;
        padding: 20px;
      }

      .boot-sider {
        background: #eff9f7;
        border: 1px solid #cfe4df;
        border-radius: 8px;
        box-shadow: 8px 0 28px rgb(77 124 119 / 8%);
        min-height: calc(100vh - 40px);
        padding: 16px 12px;
      }

      .boot-brand {
        align-items: center;
        background: rgb(255 255 255 / 66%);
        border: 1px solid #d8ebe7;
        border-radius: 8px;
        display: flex;
        gap: 12px;
        padding: 10px;
      }

      .boot-mark {
        align-items: center;
        background: #d9f3ee;
        border-radius: 8px;
        color: #0d7772;
        display: inline-flex;
        flex: 0 0 auto;
        height: 42px;
        justify-content: center;
        width: 42px;
      }

      .boot-mark svg {
        display: block;
      }

      .boot-eyebrow {
        color: #647b79;
        display: block;
        font-size: 12px;
        line-height: 1;
        margin-bottom: 4px;
      }

      .boot-title {
        color: #173333;
        font-size: 18px;
        font-weight: 750;
        line-height: 1.25;
        margin: 0;
      }

      .boot-menu {
        display: grid;
        gap: 8px;
        margin-top: 22px;
      }

      .boot-menu-line {
        background: #d5f0eb;
        border: 1px solid #a9dcd4;
        border: 0;
        border-radius: 8px;
        height: 40px;
      }

      .boot-menu-line:nth-child(2),
      .boot-menu-line:nth-child(3),
      .boot-menu-line:nth-child(4) {
        background: rgb(255 255 255 / 58%);
        border: 1px solid #d8ebe7;
        width: 86%;
      }

      .boot-menu-line:nth-child(4) {
        width: 68%;
      }

      .boot-main {
        min-width: 0;
        overflow: hidden;
      }

      .boot-desktop {
        display: block;
        margin: 0 auto;
        max-width: 1380px;
      }

      .boot-mobile {
        display: none;
      }

      .boot-topbar {
        align-items: flex-start;
        display: flex;
        gap: 24px;
        justify-content: space-between;
        margin-bottom: 18px;
      }

      .boot-kicker {
        align-items: center;
        color: #167f7b;
        display: inline-flex;
        font-size: 13px;
        font-weight: 750;
        gap: 8px;
        margin-bottom: 8px;
      }

      .boot-topbar h2,
      .boot-mobile h2 {
        color: #1a2733;
        font-size: 30px;
        font-weight: 800;
        line-height: 1.18;
        margin: 0 0 8px;
        text-wrap: balance;
      }

      .boot-topbar p,
      .boot-mobile p {
        color: #64717f;
        font-size: 14px;
        line-height: 1.65;
        margin: 0;
        max-width: 72ch;
      }

      .boot-actions {
        align-items: center;
        display: flex;
        flex: 0 0 auto;
        gap: 8px;
        justify-content: flex-end;
        min-width: 280px;
      }

      .boot-action,
      .boot-filter,
      .boot-search,
      .boot-stat,
      .boot-panel,
      .boot-row,
      .boot-cell,
      .boot-source-row,
      .boot-mobile-search,
      .boot-mobile-filter,
      .boot-mobile-card,
      .boot-mobile-line,
      .boot-mobile-nav-item {
        background: linear-gradient(100deg, #f8faf9 8%, #dff1ee 18%, #f8faf9 33%);
        background-size: 200% 100%;
        animation: boot-shimmer 1400ms ease-in-out infinite;
      }

      .boot-action {
        border-radius: 8px;
        height: 36px;
        width: 92px;
      }

      .boot-action.is-primary {
        width: 112px;
      }

      .boot-control {
        align-items: center;
        background: #fff;
        border: 1px solid #d8e1e5;
        border-radius: 8px;
        display: flex;
        gap: 8px;
        margin-bottom: 16px;
        padding: 12px;
      }

      .boot-filter {
        border-radius: 7px;
        height: 32px;
        width: 76px;
      }

      .boot-search {
        border-radius: 8px;
        height: 32px;
        margin-left: auto;
        max-width: 420px;
        width: 34%;
      }

      .boot-stats {
        display: grid;
        gap: 12px;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        margin-bottom: 16px;
      }

      .boot-stat {
        border: 1px solid #d8e1e5;
        border-radius: 8px;
        height: 112px;
      }

      .boot-workbench {
        align-items: start;
        display: grid;
        gap: 14px;
        grid-template-columns: minmax(0, 1fr) minmax(320px, 380px);
      }

      .boot-panel {
        border: 1px solid #d8e1e5;
        border-radius: 8px;
        min-height: 424px;
        padding: 14px;
      }

      .boot-panel.is-side {
        min-height: 424px;
      }

      .boot-row {
        border-radius: 8px;
        display: grid;
        gap: 10px;
        grid-template-columns: 1.6fr 0.8fr 0.8fr 0.7fr;
        height: 42px;
        margin-bottom: 10px;
        padding: 8px;
      }

      .boot-row.is-header {
        height: 34px;
        opacity: 0.74;
      }

      .boot-cell {
        background: rgb(255 255 255 / 50%);
        border-radius: 8px;
        height: 100%;
        margin: 0;
      }

      .boot-source-row {
        border-radius: 8px;
        height: 74px;
        margin-bottom: 10px;
      }

      .boot-source-row:nth-child(3n) {
        height: 112px;
      }

      .boot-status {
        align-items: center;
        color: #64717f;
        display: flex;
        font-size: 14px;
        gap: 10px;
        margin-top: 16px;
      }

      .boot-dot {
        animation: boot-pulse 900ms ease-in-out infinite;
        background: #167f7b;
        border-radius: 999px;
        height: 8px;
        width: 8px;
      }

      .boot-noscript {
        background: #fff7e6;
        border: 1px solid #ffd591;
        border-radius: 8px;
        color: #614700;
        display: block;
        line-height: 1.6;
        margin-top: 16px;
        padding: 12px;
      }

      .boot-mobile-shell {
        background: #fbfcfd;
        min-height: 100vh;
        padding: 18px 16px 88px;
      }

      .boot-mobile-header {
        align-items: center;
        display: flex;
        gap: 10px;
        justify-content: space-between;
        margin-bottom: 20px;
      }

      .boot-mobile-brand {
        align-items: center;
        display: flex;
        gap: 10px;
        min-width: 0;
      }

      .boot-mobile-brand .boot-mark {
        height: 38px;
        width: 38px;
      }

      .boot-mobile-brand h1 {
        color: #173333;
        font-size: 17px;
        line-height: 1.25;
        margin: 0;
      }

      .boot-mobile-chip {
        background: #fff7e6;
        border: 1px solid #ffe0a6;
        border-radius: 999px;
        color: #7a4b00;
        flex: 0 0 auto;
        font-size: 12px;
        font-weight: 700;
        padding: 6px 10px;
      }

      .boot-mobile h2 {
        font-size: 24px;
        margin-bottom: 8px;
      }

      .boot-mobile-controls {
        display: grid;
        gap: 10px;
        grid-template-columns: 1fr 88px;
        margin: 20px 0 14px;
      }

      .boot-mobile-search,
      .boot-mobile-filter {
        border: 1px solid #d8e1e5;
        border-radius: 8px;
        height: 44px;
      }

      .boot-mobile-tabs {
        display: flex;
        gap: 8px;
        margin-bottom: 14px;
        overflow: hidden;
      }

      .boot-mobile-tab {
        background: #e8f5f2;
        border: 1px solid #cde7e2;
        border-radius: 999px;
        flex: 0 0 auto;
        height: 34px;
        width: 72px;
      }

      .boot-mobile-card {
        border: 1px solid #d8e1e5;
        border-radius: 8px;
        min-height: 132px;
        margin-bottom: 12px;
        padding: 14px;
      }

      .boot-mobile-line {
        background: rgb(255 255 255 / 56%);
        border-radius: 8px;
        display: block;
        height: 14px;
        margin-bottom: 12px;
      }

      .boot-mobile-line:nth-child(1) {
        height: 18px;
        width: 72%;
      }

      .boot-mobile-line:nth-child(2) {
        width: 92%;
      }

      .boot-mobile-line:nth-child(3) {
        width: 58%;
      }

      .boot-mobile-nav {
        background: #fff;
        border-top: 1px solid #dbe4e8;
        bottom: 0;
        display: grid;
        gap: 8px;
        grid-template-columns: repeat(4, 1fr);
        left: 0;
        padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
        position: fixed;
        right: 0;
      }

      .boot-mobile-nav-item {
        border-radius: 8px;
        height: 42px;
      }

      @keyframes boot-shimmer {
        0% {
          background-position: 100% 0;
        }

        100% {
          background-position: -100% 0;
        }
      }

      @keyframes boot-pulse {
        0%,
        100% {
          opacity: 0.42;
          transform: scale(0.86);
        }

        50% {
          opacity: 1;
          transform: scale(1);
        }
      }

      @media (max-width: 1180px) and (min-width: 821px) {
        .boot-shell {
          grid-template-columns: 220px minmax(0, 1fr);
        }

        .boot-stats {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .boot-workbench {
          grid-template-columns: 1fr;
        }

        .boot-panel.is-side {
          min-height: 220px;
        }
      }

      @media (max-width: 820px) {
        .boot-shell {
          grid-template-columns: 1fr;
          padding: 0;
        }

        .boot-sider {
          display: none;
        }

        .boot-desktop {
          display: none;
        }

        .boot-mobile {
          display: block;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-action,
        .boot-filter,
        .boot-search,
        .boot-stat,
        .boot-panel,
        .boot-row,
        .boot-cell,
        .boot-source-row,
        .boot-mobile-search,
        .boot-mobile-filter,
        .boot-mobile-card,
        .boot-mobile-line,
        .boot-mobile-nav-item,
        .boot-dot {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="boot-shell">
        <aside class="boot-sider" aria-label="应用导航占位">
          <div class="boot-brand">
            <span class="boot-mark" aria-hidden="true">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                <path d="M12 3 21 7.5 12 12 3 7.5 12 3Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
                <path d="m3 12 9 4.5 9-4.5M3 16.5 12 21l9-4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </span>
            <div>
              <span class="boot-eyebrow">Practice Lab</span>
              <h1 class="boot-title">算法练习工作台</h1>
            </div>
          </div>
          <div class="boot-menu" aria-hidden="true">
            <span class="boot-menu-line"></span>
            <span class="boot-menu-line"></span>
            <span class="boot-menu-line"></span>
            <span class="boot-menu-line"></span>
          </div>
        </aside>

        <section class="boot-main">
          <div class="boot-desktop" aria-labelledby="boot-heading-desktop">
            <header class="boot-topbar">
              <div>
                <span class="boot-kicker">B 端 / 题库运营工作台</span>
                <h2 id="boot-heading-desktop">练习工作台加载中</h2>
                <p>题库目录、来源证据、题目维护、知识点覆盖和 IDE 练习正在准备。</p>
              </div>
              <div class="boot-actions" aria-hidden="true">
                <span class="boot-action"></span>
                <span class="boot-action is-primary"></span>
              </div>
            </header>

            <div class="boot-control" aria-hidden="true">
              <span class="boot-filter"></span>
              <span class="boot-filter"></span>
              <span class="boot-filter"></span>
              <span class="boot-search"></span>
            </div>

            <div class="boot-stats" aria-hidden="true">
              <span class="boot-stat"></span>
              <span class="boot-stat"></span>
              <span class="boot-stat"></span>
              <span class="boot-stat"></span>
            </div>

            <div class="boot-workbench" aria-hidden="true">
              <div class="boot-panel">
                <div class="boot-row is-header">
                  <span class="boot-cell"></span>
                  <span class="boot-cell"></span>
                  <span class="boot-cell"></span>
                  <span class="boot-cell"></span>
                </div>
                <div class="boot-row">
                  <span class="boot-cell"></span>
                  <span class="boot-cell"></span>
                  <span class="boot-cell"></span>
                  <span class="boot-cell"></span>
                </div>
                <div class="boot-row">
                  <span class="boot-cell"></span>
                  <span class="boot-cell"></span>
                  <span class="boot-cell"></span>
                  <span class="boot-cell"></span>
                </div>
                <div class="boot-row">
                  <span class="boot-cell"></span>
                  <span class="boot-cell"></span>
                  <span class="boot-cell"></span>
                  <span class="boot-cell"></span>
                </div>
                <div class="boot-row">
                  <span class="boot-cell"></span>
                  <span class="boot-cell"></span>
                  <span class="boot-cell"></span>
                  <span class="boot-cell"></span>
                </div>
                <div class="boot-row">
                  <span class="boot-cell"></span>
                  <span class="boot-cell"></span>
                  <span class="boot-cell"></span>
                  <span class="boot-cell"></span>
                </div>
              </div>

              <div class="boot-panel is-side">
                <div class="boot-source-row"></div>
                <div class="boot-source-row"></div>
                <div class="boot-source-row"></div>
              </div>
            </div>

            <div class="boot-status" role="status" aria-live="polite">
              <span class="boot-dot" aria-hidden="true"></span>
              <span>正在加载 B 端工作台</span>
            </div>
          </div>

          <div class="boot-mobile" aria-labelledby="boot-heading-mobile">
            <div class="boot-mobile-shell">
              <header class="boot-mobile-header">
                <div class="boot-mobile-brand">
                  <span class="boot-mark" aria-hidden="true">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                      <path d="M12 3 21 7.5 12 12 3 7.5 12 3Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
                      <path d="m3 12 9 4.5 9-4.5M3 16.5 12 21l9-4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                  </span>
                  <h1>算法练习</h1>
                </div>
                <span class="boot-mobile-chip">同步中</span>
              </header>

              <span class="boot-kicker">Mobile / 学习练习端</span>
              <h2 id="boot-heading-mobile">练习内容加载中</h2>
              <p>题目、知识点、代码练习和学习进度正在准备。</p>

              <div class="boot-mobile-controls" aria-hidden="true">
                <span class="boot-mobile-search"></span>
                <span class="boot-mobile-filter"></span>
              </div>

              <div class="boot-mobile-tabs" aria-hidden="true">
                <span class="boot-mobile-tab"></span>
                <span class="boot-mobile-tab"></span>
                <span class="boot-mobile-tab"></span>
              </div>

              <div class="boot-mobile-card" aria-hidden="true">
                <span class="boot-mobile-line"></span>
                <span class="boot-mobile-line"></span>
                <span class="boot-mobile-line"></span>
              </div>
              <div class="boot-mobile-card" aria-hidden="true">
                <span class="boot-mobile-line"></span>
                <span class="boot-mobile-line"></span>
                <span class="boot-mobile-line"></span>
              </div>

              <div class="boot-status" role="status" aria-live="polite">
                <span class="boot-dot" aria-hidden="true"></span>
                <span>正在加载移动端练习页</span>
              </div>
            </div>

            <nav class="boot-mobile-nav" aria-label="移动端导航占位">
              <span class="boot-mobile-nav-item"></span>
              <span class="boot-mobile-nav-item"></span>
              <span class="boot-mobile-nav-item"></span>
              <span class="boot-mobile-nav-item"></span>
            </nav>
          </div>

          <noscript>
            <span class="boot-noscript">请启用 JavaScript 后继续使用算法练习工作台。</span>
          </noscript>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
