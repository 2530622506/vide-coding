<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#eff9f7" />
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="面向 GESP 与 AtCoder 的算法练习工作台，支持题库浏览、题目维护、来源证据和 IDE 练习。"
    />
    <meta name="application-name" content="算法练习工作台" />
    <link
      rel="icon"
      href='data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"%3E%3Crect width="48" height="48" rx="10" fill="%23d9f3ee"/%3E%3Cpath d="M24 10 36 16 24 22 12 16 24 10Z" fill="none" stroke="%23167f7b" stroke-width="3" stroke-linejoin="round"/%3E%3Cpath d="M12 24 24 30 36 24M12 32 24 38 36 32" fill="none" stroke="%23167f7b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/%3E%3C/svg%3E'
    />
    <title>算法练习工作台</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      :root {
        color: #18221f;
        background: #eef1eb;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        font-kerning: normal;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
      }

      html {
        min-width: 320px;
      }

      body {
        background:
          radial-gradient(circle at 20% 12%, rgb(244 198 106 / 22%), transparent 34%),
          linear-gradient(135deg, #eef1eb 0%, #f7f5ec 45%, #eef1eb 100%);
        margin: 0;
        min-width: 320px;
      }

      .boot-shell {
        align-items: center;
        display: grid;
        gap: 42px;
        grid-template-columns: minmax(0, 420px) minmax(320px, 390px);
        justify-content: center;
        min-height: 100vh;
        padding: 32px;
      }

      .boot-sider {
        background: transparent;
        border-right: 0;
        box-shadow: none;
        padding: 0;
      }

      .boot-brand {
        align-items: center;
        background: #fbfaf5;
        border: 1px solid #d9ded5;
        border-radius: 8px;
        display: flex;
        gap: 12px;
        padding: 12px;
      }

      .boot-mark {
        align-items: center;
        background: #e1eee8;
        border-radius: 8px;
        color: #0f6b50;
        display: inline-flex;
        flex: 0 0 auto;
        height: 42px;
        justify-content: center;
        width: 42px;
      }

      .boot-mark svg {
        display: block;
      }

      .boot-eyebrow {
        color: #68756f;
        display: block;
        font-size: 12px;
        line-height: 1;
        margin-bottom: 4px;
      }

      .boot-title {
        color: #18221f;
        font-size: 18px;
        font-weight: 750;
        line-height: 1.25;
        margin: 0;
      }

      .boot-menu {
        display: grid;
        gap: 8px;
        margin-top: 24px;
      }

      .boot-menu-line {
        background: #18332b;
        border: 0;
        border-radius: 8px;
        height: 40px;
      }

      .boot-menu-line:nth-child(2),
      .boot-menu-line:nth-child(3),
      .boot-menu-line:nth-child(4) {
        background: rgb(255 255 255 / 48%);
        border: 1px solid #d9ded5;
        width: 86%;
      }

      .boot-main {
        background: #fbfaf5;
        border: 10px solid #111916;
        border-radius: 30px;
        box-shadow: 0 24px 60px rgb(31 41 35 / 14%);
        height: min(844px, calc(100vh - 64px));
        overflow: hidden;
        padding: 38px 28px;
      }

      .boot-heading {
        max-width: 760px;
      }

      .boot-kicker {
        align-items: center;
        color: #0f6b50;
        display: inline-flex;
        font-size: 13px;
        font-weight: 750;
        gap: 8px;
        margin-bottom: 8px;
      }

      .boot-heading h1 {
        color: #18221f;
        font-size: 30px;
        font-weight: 800;
        line-height: 1.18;
        margin: 0 0 8px;
        text-wrap: balance;
      }

      .boot-heading p {
        color: #68756f;
        font-size: 14px;
        line-height: 1.65;
        margin: 0;
        max-width: 65ch;
      }

      .boot-control {
        background: #fff;
        border: 1px solid #d9ded5;
        border-radius: 8px;
        display: flex;
        gap: 8px;
        margin-top: 32px;
        padding: 12px;
      }

      .boot-pill,
      .boot-input,
      .boot-card,
      .boot-cell {
        background: linear-gradient(100deg, #f8f6ed 8%, #e1eee8 18%, #f8f6ed 33%);
        background-size: 200% 100%;
        animation: boot-shimmer 1400ms ease-in-out infinite;
      }

      .boot-pill {
        border-radius: 7px;
        height: 32px;
        width: 56px;
      }

      .boot-input {
        border-radius: 8px;
        height: 32px;
        max-width: 320px;
        width: 34%;
      }

      .boot-grid {
        display: grid;
        gap: 14px;
        grid-template-columns: 1fr;
        margin-top: 16px;
      }

      .boot-card {
        border: 1px solid #d9ded5;
        border-radius: 8px;
        min-height: 142px;
        padding: 16px;
      }

      .boot-card.is-list {
        min-height: 220px;
      }

      .boot-card.is-side {
        min-height: 142px;
      }

      .boot-cell {
        border-radius: 8px;
        height: 42px;
        margin-bottom: 10px;
      }

      .boot-cell:nth-child(2n) {
        width: 82%;
      }

      .boot-cell:nth-child(3n) {
        width: 64%;
      }

      .boot-status {
        align-items: center;
        color: #68756f;
        display: flex;
        font-size: 14px;
        gap: 10px;
        margin-top: 16px;
      }

      .boot-dot {
        animation: boot-pulse 900ms ease-in-out infinite;
        background: #0f6b50;
        border-radius: 999px;
        height: 8px;
        width: 8px;
      }

      .boot-noscript {
        background: #fff7e6;
        border: 1px solid #ffd591;
        border-radius: 8px;
        color: #614700;
        display: block;
        line-height: 1.6;
        margin-top: 16px;
        padding: 12px;
      }

      @keyframes boot-shimmer {
        0% {
          background-position: 100% 0;
        }

        100% {
          background-position: -100% 0;
        }
      }

      @keyframes boot-pulse {
        0%,
        100% {
          opacity: 0.42;
          transform: scale(0.86);
        }

        50% {
          opacity: 1;
          transform: scale(1);
        }
      }

      @media (max-width: 1180px) {
        .boot-grid {
          grid-template-columns: 1fr;
        }

        .boot-card.is-side {
          grid-column: 1 / -1;
          min-height: 220px;
        }
      }

      @media (max-width: 820px) {
        .boot-shell {
          grid-template-columns: 1fr;
          padding: 0;
        }

        .boot-sider {
          display: none;
        }

        .boot-menu {
          display: none;
        }

        .boot-main {
          border: 0;
          border-radius: 0;
          box-shadow: none;
          height: 100vh;
          padding: 38px 28px;
        }

        .boot-heading h1 {
          font-size: 26px;
        }

        .boot-control {
          flex-wrap: wrap;
          margin-top: 20px;
        }

        .boot-input {
          width: 100%;
        }

        .boot-grid {
          grid-template-columns: 1fr;
        }

        .boot-card,
        .boot-card.is-list,
        .boot-card.is-side {
          min-height: 180px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-pill,
        .boot-input,
        .boot-card,
        .boot-cell,
        .boot-dot {
          animation: none;
        }
      }
    </style>
    <script type="module" crossorigin src="/assets/index-CF_kdZrw.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/jsx-runtime-CIAT9TAX.js">
    <link rel="modulepreload" crossorigin href="/assets/preload-helper-zJ_50EbN.js">
    <link rel="modulepreload" crossorigin href="/assets/client-D799b9cX.js">
  </head>
  <body>
    <div id="root">
      <main class="boot-shell">
        <aside class="boot-sider" aria-label="应用导航占位">
          <div class="boot-brand">
            <span class="boot-mark" aria-hidden="true">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                <path d="M12 3 21 7.5 12 12 3 7.5 12 3Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
                <path d="m3 12 9 4.5 9-4.5M3 16.5 12 21l9-4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </span>
            <div>
              <span class="boot-eyebrow">Practice Lab</span>
              <h1 class="boot-title">算法练习工作台</h1>
            </div>
          </div>
          <div class="boot-menu" aria-hidden="true">
            <span class="boot-menu-line"></span>
            <span class="boot-menu-line"></span>
            <span class="boot-menu-line"></span>
            <span class="boot-menu-line"></span>
          </div>
        </aside>

        <section class="boot-main" aria-labelledby="boot-heading">
          <div class="boot-heading">
            <span class="boot-kicker">GESP C++ / AtCoder</span>
            <h2 id="boot-heading">练习工作台加载中</h2>
            <p>题库目录、来源证据、题目维护和 IDE 练习正在准备。</p>
          </div>

          <div class="boot-control" aria-hidden="true">
            <span class="boot-pill"></span>
            <span class="boot-pill"></span>
            <span class="boot-pill"></span>
            <span class="boot-input"></span>
          </div>

          <div class="boot-grid" aria-hidden="true">
            <div class="boot-card">
              <div class="boot-cell"></div>
              <div class="boot-cell"></div>
              <div class="boot-cell"></div>
              <div class="boot-cell"></div>
              <div class="boot-cell"></div>
            </div>
            <div class="boot-card is-list">
              <div class="boot-cell"></div>
              <div class="boot-cell"></div>
              <div class="boot-cell"></div>
              <div class="boot-cell"></div>
              <div class="boot-cell"></div>
              <div class="boot-cell"></div>
            </div>
            <div class="boot-card is-side">
              <div class="boot-cell"></div>
              <div class="boot-cell"></div>
              <div class="boot-cell"></div>
            </div>
          </div>

          <div class="boot-status" role="status" aria-live="polite">
            <span class="boot-dot" aria-hidden="true"></span>
            <span>正在加载工作台</span>
          </div>

          <noscript>
            <span class="boot-noscript">请启用 JavaScript 后继续使用算法练习工作台。</span>
          </noscript>
        </section>
      </main>
    </div>
  </body>
</html>
