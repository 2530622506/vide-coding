<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>wanjuanwang:2023-12:cxx:level-4:selection:14:0jdosbmjkhoddqmu8zpl</title>
<style>
body { margin: 0; padding: 24px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f7f8fa; color: #1f2937; }
.card { background: #fff; border: 1px solid #d9dee7; border-radius: 12px; padding: 20px; max-width: 1000px; margin: 0 auto; }
h1 { font-size: 20px; margin: 0 0 12px; }
.grid { display: grid; grid-template-columns: 48px 1fr; gap: 12px; margin-top: 16px; }
.item { border: 1px solid #d9dee7; border-radius: 8px; padding: 12px; background: #fff; }
.item img { max-width: 100%; max-height: 180px; object-fit: contain; display:block; }
small { color: #6b7280; }
</style>
</head>
<body>
<div class="card" id="app">loading...</div>
<script>
fetch("http://127.0.0.1:3001/api/catalog/problems/wanjuanwang%3A2023-12%3Acxx%3Alevel-4%3Aselection%3A14%3A0jdosbmjkhoddqmu8zpl")
  .then(r => r.json())
  .then(problem => {
    const detail = problem.detail;
    const options = detail?.choice_options?.options || [];
    const rows = options.map(option => {
      const isImage = /^https?:\/\//.test(option.text);
      const content = isImage
        ? '<img src="' + option.text + '" alt="' + option.key + '">'
        : option.text;
      return '<div>' + option.key + '</div><div class="item">' + content + '</div>';
    }).join('');
    document.getElementById('app').innerHTML =
      '<h1>下面C++代码执行后的结果是( )。</h1>' +
      '<small>wanjuanwang:2023-12:cxx:level-4:selection:14:0jdosbmjkhoddqmu8zpl</small>' +
      '<div class="grid">' + rows + '</div>';
  });
</script>
</body>
